[project]
name = "ferroscope"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "drBat1998", email = "romankoval20081998@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bioio>=3.6.0",
    "bioio-czi>=3.1.0",
    "bioio-ome-tiff>=1.4.1",
    "bioio-ome-zarr>=3.8.1",
    "bioio-tifffile>=1.3.1",
    "dask[array]>=2026.8.0",
    "dataclasses>=0.8",
    "numpy>=2.5.4",
    "pathlib>=1.0.1",
    "pytest>=9.2.0",
    "tifffile>=2026.10.15",
]

[project.optional-dependencies]
napari = [
    "napari[pyqt6]>=0.9.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "tifffile>=2026.10.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:bioio_ome_tiff",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]
